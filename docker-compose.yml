services:
  postgres:
    image: postgres:16-alpine
    container_name: colometria-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: colometria
      POSTGRES_PASSWORD: colometria
      POSTGRES_DB: colometria
    volumes:
      - colometria_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colometria -d colometria"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  colometria_pg_data:
