# Stack de produção para VPS — Postgres só na rede interna (não exposto na internet).
# Uso:
#   cp .env.production.example .env.production
#   # edite AUTH_SECRET, AUTH_URL, POSTGRES_PASSWORD, HF_TOKEN...
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: colorimetria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-colometria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-colometria}
    volumes:
      - colorimetria_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-colometria} -d ${POSTGRES_DB:-colometria}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: colorimetria-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-colometria}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-colometria}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set_AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:?set_AUTH_URL}
      UPLOAD_DIR: /app/uploads
      VTO_PROVIDER: ${VTO_PROVIDER:-huggingface}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_VTO_MODEL: ${HF_VTO_MODEL:-}
      VTO_DAILY_LIMIT: ${VTO_DAILY_LIMIT:-5}
      VTO_UNLIMITED_EMAILS: ${VTO_UNLIMITED_EMAILS:-}
      FACE_DETECTOR: ${FACE_DETECTOR:-blazeface}
      COLOR_PREDICTOR: ${COLOR_PREDICTOR:-rules}
      PHOTO_RETENTION_DAYS: ${PHOTO_RETENTION_DAYS:-365}
      NODE_ENV: production
    volumes:
      - colorimetria_uploads:/app/uploads
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 50s
      retries: 5

volumes:
  colorimetria_pg_data:
  colorimetria_uploads:

networks:
  internal:
    driver: bridge
